name: Profile metrics

on:
  schedule:
    - cron: "0 3 * * *"   # her gün 06:00 (TR saati)
  workflow_dispatch:       # Actions sekmesinden elle çalıştırmak için

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
      GH_USER: ygttncy
      GH_ORGS: Viora-Software
    steps:
      - uses: actions/checkout@v4

      # GitHub Stats kartı -> profile/stats.svg
      - name: Generate stats card
        run: python3 scripts/stats_card.py

      # Most Used Languages kartı -> profile/top-langs.svg
      - name: Generate top languages
        env:
          TOP_N: "8"
          EXCLUDE_LANGS: java
          EXCLUDE_REPOS: ""          # örn: "eski-proje, Viora-Software/deneme"
          INCLUDE_FORKS: "false"
        run: python3 scripts/top_langs.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git diff --cached --quiet || git commit -m "chore: update profile cards"
          git push
