name: Profile metrics

on:
  schedule:
    - cron: "0 3 * * *"   # her gün 06:00 (TR saati)
  workflow_dispatch:       # Actions sekmesinden elle çalıştırmak için

jobs:
  top-languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ygttncy
          filename: profile/top-langs.svg
          output_action: commit
          committer_message: "chore: update top languages"

          # Kendi repoların + üyesi olduğun organizasyonların (Viora-Software) repoları
          repositories_affiliations: owner, organization_member
          repositories_skipped: ""

          # Sadece dil kartı
          base: ""
          template: classic
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_details: percentage

          # Dark + turuncu tema
          extras_css: |
            svg { background: #111111; border-radius: 10px; }
            h2, h2 svg { color: #FF6B1A !important; fill: #FF6B1A !important; }
            .field, .field svg, .language { color: #FAFAFA !important; fill: #FAFAFA !important; }
